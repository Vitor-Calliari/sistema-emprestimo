<mat-toolbar color="primary">
  <button mat-icon-button (click)="sidenav.toggle()">
    <mat-icon>menu</mat-icon>
  </button>
  <span>Gestão de Empréstimos</span>
</mat-toolbar>

<mat-sidenav-container class="container">
  <mat-sidenav #sidenav
      [mode]="isMobile() ? 'over' : 'side'"
      [opened]="!isMobile()"
      class="sidenav">
    <mat-nav-list>
      <a mat-list-item routerLink="/home" routerLinkActive="active-link"
         (click)="fecharSidenavSeMobile(sidenav)">
        <mat-icon matListItemIcon>dashboard</mat-icon>
        <span matListItemTitle>Início</span>
      </a>
      <a mat-list-item routerLink="/clientes" routerLinkActive="active-link"
         (click)="fecharSidenavSeMobile(sidenav)">
        <mat-icon matListItemIcon>people</mat-icon>
        <span matListItemTitle>Clientes</span>
      </a>
      <a mat-list-item routerLink="/emprestimos" routerLinkActive="active-link"
         (click)="fecharSidenavSeMobile(sidenav)">
        <mat-icon matListItemIcon>payments</mat-icon>
        <span matListItemTitle>Empréstimos</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="content">
    <router-outlet></router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>
