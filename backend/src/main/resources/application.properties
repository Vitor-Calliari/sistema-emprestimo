spring.application.name=emprestimos

# Conexao com o Postgres (mesmas credenciais do docker-compose.yml)
spring.datasource.url=jdbc:postgresql://localhost:5432/emprestimos
spring.datasource.username=admin
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# Como o schema ja foi criado manualmente via DDL, o Hibernate so valida
# que as entidades batem com as tabelas existentes - nao altera nada
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080
